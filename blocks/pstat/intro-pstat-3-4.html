<p class="lead">관찰한 결과가 우연으로 설명될 수 있는지를 확률로 판단하는 방법이 <em>가설검정</em>입니다. 귀무가설이 참일 때 이만큼 극단적인 결과가 나올 확률(유의확률)이 충분히 작으면 귀무가설을 기각합니다. 이 절에서는 가설검정의 논리를 익히고, 검정을 여러 번 할 때의 함정을 살펴봅니다.</p>
