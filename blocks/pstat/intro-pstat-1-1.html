<p class="lead">통계는 흩어진 자료에서 규칙을 찾아 판단의 근거를 만드는 도구입니다. 같은 자료라도 어떻게 정리하고 나타내느냐에 따라 보이는 것이 달라집니다. 이 절에서는 통계가 문제 해결에 쓰인 역사적 사례를 보고, 통계로 답할 수 있는 <em>통계적 질문</em>이 무엇인지 알아봅니다.</p>
