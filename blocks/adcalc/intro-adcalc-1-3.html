<p class="lead">\(\cosh x\)와 \(\sinh x\)는 \(e^x\)와 \(e^{-x}\)로 만든 함수이므로 지수함수의 도함수에서 바로 도함수가 나옵니다. 결과는 삼각함수와 닮았지만 부호 하나가 다릅니다. 이 절에서는 접선의 기울기를 따라가며 도함수를 확인하고, 삼각함수를 흉내 내다 생기는 계산 오류를 찾고, 공기 저항을 받으며 떨어지는 스카이다이버의 속도가 \(\tanh\)로 나타나는 까닭을 미분으로 확인합니다.</p>
