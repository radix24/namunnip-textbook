<p class="lead">방향장을 따라 "조금 가고, 기울기를 다시 보고, 또 조금 간다"를 계산으로 하는 것이 <em>오일러의 방법</em>입니다. 식으로 풀 수 없는 미분방정식도 이 방법으로 근사해를 얻을 수 있습니다. 이 절에서는 걸음 크기를 줄여 가며 오차가 어떻게 줄어드는지 확인하고, 오차가 한쪽으로 쌓이면 원을 그려야 할 공이 나선을 그리며 달아나는 것을 시뮬레이션으로 봅니다.</p>
<div class="prereq">
  <span class="mono">먼저 알면 좋은 것</span>
