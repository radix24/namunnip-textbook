<p class="lead">\(r = f(\theta)\)꼴의 방정식이 나타내는 곡선을 <em>극곡선</em>이라고 합니다. 각 \(\theta\) 방향으로 \(f(\theta)\)만큼 간 점을 이으면 카디오이드, 장미, 나선 같은 모양이 생깁니다. 이 절에서는 보통의 그래프와 극곡선을 나란히 그려 두 그림을 잇고, 대칭성으로 그리는 수고를 줄이고, 장미 곡선의 꽃잎 수를 맞혀 보고, 무대용 마이크가 뒤쪽 소리를 덜 받는 까닭을 카디오이드로 설명합니다.</p>
