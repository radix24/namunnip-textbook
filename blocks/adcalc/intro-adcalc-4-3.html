<p class="lead">\(y' = f(x)g(y)\)꼴의 미분방정식은 \(x\)와 \(y\)를 양쪽으로 갈라 각각 적분하면 풀립니다. 이것이 <em>변수분리형</em> 미분방정식입니다. 풀이에 나오는 상수는 해 곡선의 가족에서 하나를 고르는 꼬리표이고, 초기 조건이 그 값을 정합니다. 이 절에서는 풀이의 단계를 순서대로 조립하고, 적분상수를 잘못 다루거나 상수해를 잃어버리는 흔한 오류를 찾습니다.</p>
