<p class="lead">\(x\)의 거듭제곱을 끝없이 더한 <em>멱급수</em>는 \(x\)의 값에 따라 수렴하기도 하고 발산하기도 합니다. 수렴하는 \(x\)의 범위는 언제나 중심에서 양쪽으로 같은 거리 \(R\)까지인 구간이고, 이 \(R\)을 수렴반경이라고 합니다. 이 절에서는 비판정법으로 수렴반경을 구하고 끝점을 따로 판정하며, 실수 직선에서는 아무 문제가 없어 보이는 함수의 급수가 왜 중간에 멈추는지 살펴봅니다.</p>
