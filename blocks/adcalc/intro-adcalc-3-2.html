<p class="lead">항이 모두 양수인 급수는 부분합이 늘 커지므로, 부분합이 어떤 수에 막혀 있는지만 알면 수렴을 판정할 수 있습니다. 이 절에서는 급수를 이상적분과 비교하는 적분판정법으로 \(\sum\frac{1}{n^p}\)의 수렴을 판정하고, 비교·비·근판정법 가운데 급수에 맞는 것을 골라 봅니다. 그리고 조화급수가 발산한다는 사실 덕분에 책을 충분히 쌓으면 탁자 밖으로 얼마든지 멀리 내밀 수 있다는 것을 확인합니다.</p>
