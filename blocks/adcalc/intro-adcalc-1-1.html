<p class="lead">근의 공식이 없는 방정식도 근을 원하는 만큼 정확히 구할 수 있습니다. 곡선 대신 접선이 \(x\)축과 만나는 곳을 구하고, 그 점에서 다시 접선을 긋는 일을 되풀이하면 됩니다. 이것이 <em>뉴턴의 방법</em>입니다. 이 절에서는 접선을 따라 근으로 다가가며 맞는 자릿수가 두 배씩 늘어나는 것을 확인하고, 계산기가 제곱근을 구하는 원리를 이분법과 겨루어 보고, 뉴턴의 방법이 엉뚱한 근으로 가는 경우를 예측해 봅니다.</p>
