<p class="lead">극좌표에서는 한 점이 여러 이름을 가지므로, 두 극방정식을 연립해 풀어도 교점이 모두 나오지 않을 수 있습니다. 이 절에서는 그림에서 교점을 직접 찾아 연립방정식의 해와 비교하고, 빠진 교점이 어디에서 왔는지 밝힙니다. 그리고 교점에서 두 곡선이 이루는 각을 반지름과 접선의 각 \(\psi\)로 구해, 마주 보는 두 카디오이드가 크기와 상관없이 수직으로 만나는 것을 확인합니다.</p>
<div class="prereq">
  <span class="mono">먼저 알면 좋은 것</span>
  <span class="p">삼각함수의 정의와 그래프</span><span class="p">매개변수로 나타낸 함수의 미분</span>
