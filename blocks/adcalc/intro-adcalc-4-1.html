<p class="lead">도함수와 함수 사이의 관계식을 <em>미분방정식</em>이라고 합니다. 미분방정식 \(y' = f(x, y)\)는 평면의 각 점에서 해 곡선이 가져야 할 기울기를 알려 줍니다. 그 기울기를 짧은 선분으로 모두 그린 것이 <em>방향장</em>이고, 해 곡선은 방향장을 따라 흐릅니다. 이 절에서는 방정식을 풀지 않고 방향장만으로 해의 모양을 그려 보고, 방향장의 생김새로 방정식을 알아맞혀 봅니다.</p>
