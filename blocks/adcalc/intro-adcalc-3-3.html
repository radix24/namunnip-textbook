<p class="lead">부호가 번갈아 바뀌는 급수는 더했다 뺐다 하며 지그재그로 합에 다가갑니다. 조화급수는 발산하지만 \(1 - \frac{1}{2} + \frac{1}{3} - \cdots\)은 \(\ln 2\)로 수렴합니다. 이 절에서는 <em>교대급수판정법</em>과 오차의 크기를 확인하고, 절댓값을 더한 급수까지 수렴하는 <em>절대수렴</em>과 그렇지 않은 <em>조건수렴</em>을 구분합니다. 조건수렴하는 급수는 항의 순서만 바꿔도 합이 달라진다는 놀라운 사실도 직접 확인합니다.</p>
