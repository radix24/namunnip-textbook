<p class="lead">극한값을 모르는데도 수열이 수렴한다고 말할 수 있을까요? 계속 커지기만 하는데 어떤 수도 넘지 못하는 수열은 어딘가에 모여들 수밖에 없습니다. 이것이 <em>단조수렴정리</em>입니다. 이 절에서는 여러 수열에 천장을 대어 보며 정리의 뜻을 확인하고, 점화식으로 정의된 수열의 극한을 구할 때 왜 수렴부터 보여야 하는지를 증명을 조립하며 살펴봅니다.</p>
