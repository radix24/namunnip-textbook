<p class="lead">극곡선이 둘러싼 넓이는 극에서 뻗은 얇은 부채꼴로 잘라 \(\frac{1}{2}\int r^2\,d\theta\)로 구하고, 길이는 \(\int\sqrt{r^2 + (r')^2}\,d\theta\)로 구합니다. 이 절에서는 부채꼴의 합이 적분으로 다가가는 것을 보고, 곡선이 두 번 그려지는 범위로 적분해 넓이를 두 배로 세는 실수를 찾고, 꺾은선으로 카디오이드의 길이 8을 확인한 뒤 두루마리 휴지에 감긴 종이의 길이를 계산합니다.</p>
<div class="prereq">
  <span class="mono">먼저 알면 좋은 것</span>
  <span class="p">부채꼴의 호의 길이와 넓이</span><span class="p">정적분과 급수의 합</span><span class="p">곡선의 길이</span>
</div>
