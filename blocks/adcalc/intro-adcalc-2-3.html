<p class="lead">극곡선은 \(\theta\)를 매개변수로 하는 곡선 \(x = f(\theta)\cos\theta\), \(y = f(\theta)\sin\theta\)입니다. 그래서 매개변수로 나타낸 곡선의 미분법으로 접선의 기울기를 구합니다. 극곡선에서는 반지름과 접선이 이루는 각 \(\psi\)가 특히 쓸모 있습니다. 이 절에서는 카디오이드에서 가장 높은 점을 찾고, 목표를 늘 같은 각도로 보며 나는 새의 길이 로그나선이 되는 것을 시뮬레이션으로 확인합니다.</p>
