<p class="lead">한 점에서 함숫값, 기울기, 휘는 정도, 그리고 더 높은 계도함수까지 원래 함수와 같게 만든 다항식이 <em>테일러다항식</em>입니다. 차수를 끝없이 올린 급수가 <em>테일러급수</em>입니다. 이 절에서는 막대로 \(\cos x\)를 흉내 내는 이차식을 직접 만들어 테일러다항식과 겨루고, 차수를 올릴 때 다항식이 원래 함수를 어디까지 따라가는지, 따라가지 못하는 함수는 어떤 것인지 살펴봅니다.</p>
