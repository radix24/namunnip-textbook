<p class="lead">곡선을 축 둘레로 돌리면 회전체가 생깁니다. 부피는 얇은 원판을 쌓아 \(\int \pi y^2\,dx\)로 구합니다. 겉넓이는 조금 더 조심해야 합니다. 얇은 원기둥 띠로 쌓으면 기울어진 옆면을 무시하게 되어 틀린 값이 나옵니다. 이 절에서는 직접 디자인한 꽃병의 부피와 겉넓이를 구하고, 겉넓이 공식에 곡선의 길이 요소가 들어가는 이유를 구로 확인하고, 페인트로 채울 수는 있지만 칠할 수는 없다는 가브리엘의 나팔을 살펴봅니다.</p>
