<p class="lead">"변하는 빠르기가 지금의 양에 비례한다"는 생각 하나로 많은 현상이 미분방정식이 됩니다. 이 절에서는 커피가 식는 빠르기가 실내와의 온도 차에 비례한다는 뉴턴의 냉각 법칙으로 우유를 넣을 때를 정하고, 원자 하나하나의 제멋대로인 붕괴에서 지수함수 법칙이 나오는 것을 시뮬레이션으로 확인해 연대 측정에 쓰고, 먹이와 공간의 한계를 넣은 로지스틱 성장을 살펴봅니다.</p>
