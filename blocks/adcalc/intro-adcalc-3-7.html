<p class="lead">테일러급수는 계산기 속의 계산, 물리 법칙의 근사, 오차의 크기를 어림하는 데 쓰입니다. 이 절에서는 계산기가 \(\sin 1000^\circ\)를 구하는 과정을 따라가 보고, 진자의 주기 공식이 \(\sin\theta \approx \theta\)라는 근사에서 나왔다는 것과 그 한계를 시뮬레이션으로 확인하고, 상대성 이론의 운동 에너지를 급수로 펼쳐 뉴턴의 \(\frac{1}{2}mv^2\)이 나오는 것을 봅니다.</p>
