<p class="lead">멱급수는 수렴 구간 안에서 다항식처럼 다룰 수 있습니다. 변수를 바꾸어 넣고, 항별로 미분하고 적분해도 됩니다. 그래서 이미 아는 등비급수 \(\frac{1}{1 - x} = \sum x^n\) 하나에서 여러 함수의 급수를 만들 수 있습니다. 이 절에서는 연산 단추를 눌러 \(\ln(1 + x)\)와 \(\tan^{-1}x\)의 급수를 직접 만들고, \(\tan^{-1}\)의 급수로 원주율을 계산하며 수렴 속도가 왜 중요한지 확인합니다.</p>

  <span class="mono">먼저 알면 좋은 것</span>
