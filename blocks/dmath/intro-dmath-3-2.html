<p class="lead">이진법의 계산 규칙은 놀랄 만큼 단순합니다. 덧셈은 \(1 + 1 = 10_{(2)}\)만 기억하면 되고, 곱셈은 밀어 적고 더하기입니다. 컴퓨터는 정해진 자리 수 안에서 계산하므로 음수를 나타내는 약속과 넘침도 함께 알아야 합니다. 이 절에서는 이진수 세로셈을 직접 해 보고, 2의 보수로 뺄셈이 덧셈이 되는 원리와 넘침을 확인합니다.</p>
