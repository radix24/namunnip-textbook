<p class="lead">순열은 늘어놓는 방법의 수였습니다. 그런데 둥근 탁자처럼 돌려서 같은 배치를 하나로 보거나, 같은 글자처럼 서로 바꿔도 같은 것이 섞여 있으면 셈이 달라집니다. 이 절에서는 같게 볼 것을 먼저 정하고 묶음의 크기로 나누는 생각으로 <em>원순열</em>과 <em>같은 것이 있는 순열</em>을 세어 봅니다.</p>
