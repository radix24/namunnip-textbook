<p class="lead">이웃한 꼭짓점을 서로 다른 색으로 칠하는 것을 그래프의 <em>채색</em>이라 합니다. 지도 칠하기, 시험 시간표 짜기, 전파 주파수 배정이 모두 채색 문제입니다. 이 절에서는 가상 지도를 최소한의 색으로 칠해 보며 4색 정리를 만나고, 색이 \(k\)가지일 때 칠하는 방법의 수인 <em>채색다항식</em>을 구해 봅니다.</p>
