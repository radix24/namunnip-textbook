<p class="lead">연결되어 있으면서 회로가 없는 그래프를 <em>수형도</em>라 합니다. 수형도는 모든 점을 잇는 가장 경제적인 연결 방법이어서, 변의 수가 꼭짓점보다 하나 적고 두 점 사이의 길이 단 하나뿐입니다. 이 절에서는 직접 수형도를 만들며 그 성질을 확인하고, 공사비가 다른 후보 구간 중에서 가장 싼 연결망을 크러스컬 방법으로 찾아봅니다.</p>
