<p class="lead">부울 식은 전기 회로로 그대로 옮겨집니다. AND, OR, NOT 같은 <em>논리 게이트</em>를 이으면 어떤 규칙이든 계산하는 회로가 되고, 이진수 덧셈의 규칙을 회로로 만들면 계산기가 됩니다. 이 절에서는 계단 조명과 금고 회로에서 신호가 흐르는 모습을 보고, 전가산기를 이어 받아올림이 전해지는 덧셈 회로를 완성합니다.</p>
<div class="prereq">
  <span class="mono">먼저 알면 좋은 것</span>

</div>
