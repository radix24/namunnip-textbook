<p class="lead">그래프를 컴퓨터에 넣으려면 그림이 아니라 수의 표로 바꿔야 합니다. 이어진 두 꼭짓점의 자리에 1, 아니면 0을 적은 행렬이 <em>인접행렬</em>입니다. 행렬로 바꾸면 행렬의 계산으로 그래프의 성질을 알아낼 수 있습니다. 이 절에서는 그래프와 인접행렬을 오가며 바꿔 보고, 인접행렬의 거듭제곱이 경로의 수를 세어 주는 것을 확인합니다.</p>
<div class="prereq">
  <span class="mono">먼저 알면 좋은 것</span>
