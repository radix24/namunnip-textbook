<p class="lead">0과 1만 가지는 변수로 이루어진 <em>부울 함수</em>는 논리를 계산으로 바꿉니다. 어떤 규칙이든 참값표를 만들면 AND, OR, NOT으로 된 식을 얻을 수 있지만, 그 식은 길어지기 쉽습니다. 이 절에서는 말로 된 규칙을 참값표와 식으로 옮기고, 카르노 맵에서 이웃한 1을 묶어 식을 간단히 만들어 봅니다.</p>
