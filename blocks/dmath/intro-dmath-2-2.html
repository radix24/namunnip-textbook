<p class="lead">점화 관계만으로도 수열의 모든 항을 차례로 구할 수 있지만, 일반항을 알면 먼 항과 극한을 바로 알 수 있습니다. \(a_{n+1} = pa_n + q\)는 고정된 값 하나를 빼면 등비수열이 됩니다. 이 절에서는 거미줄 그림으로 수열이 모이는지 흩어지는지 미리 보고, 대출 상환이라는 실제 문제를 점화식으로 풀어 봅니다.</p>
<div class="prereq">
  <span class="mono">먼저 알면 좋은 것</span>
  <span class="p">점화 관계</span><span class="p">등비수열의 합</span><span class="p">등비수열의 극한</span>
</div>
