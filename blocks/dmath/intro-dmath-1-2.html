<p class="lead">같은 사탕을 여러 친구에게 나누거나, 같은 맛을 여러 번 골라도 되는 아이스크림을 고르는 것은 서로 다른 \(n\)개에서 중복을 허락해 \(r\)개를 고르는 <em>중복조합</em>입니다. 별과 막대 그림 하나로 이 문제가 같은 것이 있는 순열로 바뀝니다. 이 절에서는 직접 나눔을 만들어 세어 보고, 조건이 붙은 방정식의 정수해 개수로 넓혀 봅니다.</p>
