<p class="lead">세금이나 소득, 원재료 값이 바뀌면 수요곡선이나 공급곡선이 이동하고 균형 가격이 달라집니다. 판매자에게 매긴 세금이라도 가격이 바뀌면서 소비자가 일부를 떠안게 됩니다. 이 절에서는 세금의 부담이 어떻게 나뉘는지 계산하고, 여러 사건이 균형을 어떻게 바꾸는지 예측해 봅니다.</p>
