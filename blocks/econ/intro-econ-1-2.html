<p class="lead"><em>환율</em>은 서로 다른 나라 돈을 바꾸는 비율입니다. 1달러에 몇 원인지로 나타내는 원/달러 환율이 오르면 원화의 가치는 떨어집니다. 이 절에서는 환율이 바뀔 때 누가 이득을 보고 누가 손해를 보는지 계산하고, 여러 통화를 거쳐 환전할 때 무엇을 따져야 하는지 알아봅니다.</p>
