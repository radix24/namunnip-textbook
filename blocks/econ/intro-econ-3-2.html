<p class="lead">\(AB = BA = I\)를 만족하는 행렬 \(B\)를 \(A\)의 <em>역행렬</em>이라 합니다. 연립일차방정식을 \(AX = B\)로 쓰면 역행렬을 곱해 해를 구할 수 있습니다. 이 절에서는 주문 기록과 세트 메뉴로 단가를 구해 보고, 역행렬이 없으면 무슨 일이 생기는지 확인합니다.</p>
