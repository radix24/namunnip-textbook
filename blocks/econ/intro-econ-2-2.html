<p class="lead">가격에 따라 사려는 양을 나타낸 함수가 <em>수요함수</em>, 팔려는 양을 나타낸 함수가 <em>공급함수</em>입니다. 가격이 바뀌면 곡선 위의 점이 움직이고, 소득이나 원재료 값처럼 다른 조건이 바뀌면 곡선 자체가 이동합니다. 이 절에서는 두 변화를 구별하고, 조사 자료로 수요함수를 직접 만들어 봅니다.</p>
