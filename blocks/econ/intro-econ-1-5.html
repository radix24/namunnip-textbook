<p class="lead">일정한 기간마다 같은 금액을 넣거나 받는 것을 <em>연금</em>이라 합니다. 연금의 원리합계와 현재 가치는 모두 등비수열의 합으로 계산됩니다. 이 절에서는 해마다 모은 돈이 얼마로 불어나는지, 나눠 받는 연금과 한 번에 받는 일시금 중 무엇이 유리한지 따져 봅니다.</p>
