<p class="lead">시간, 재료, 예산처럼 쓸 수 있는 자원이 제한되면 생산이나 소비의 조합은 연립부등식의 영역 안에서 골라야 합니다. 그 영역에서 이익을 가장 크게, 또는 비용을 가장 작게 하는 점을 찾는 방법이 <em>선형계획법</em>입니다. 이 절에서는 공방의 생산 계획과 영양 기준을 채우는 식단 문제를 풀어 봅니다.</p>
