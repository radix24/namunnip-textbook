<p class="lead">경제학에서 "한계"는 하나를 더 만들거나 팔 때의 변화, 곧 <em>미분계수</em>를 뜻합니다. 비용 함수를 미분하면 <em>한계비용</em>, 수입 함수를 미분하면 <em>한계수입</em>입니다. 이 절에서는 두 값을 그래프의 접선 기울기로 확인하고, 경제적 의미를 해석합니다.</p>
