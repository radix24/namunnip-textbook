<p class="lead">경제의 상태를 숫자로 나타낸 것을 <em>경제지표</em>라 합니다. 물가지수, 실업률, 경제성장률처럼 대부분 비율이나 지수로 되어 있어서, 계산 방법을 알아야 바르게 읽을 수 있습니다. 이 절에서는 물가지수를 직접 계산해 보고, 기사 속 퍼센트 숫자를 검산합니다.</p>
