<p class="lead">근무표, 메뉴 조합, 비밀번호처럼 가능한 경우를 모두 세어야 할 때가 있습니다. 경우가 많으면 하나하나 나열하는 대신 <em>곱의 법칙</em>으로 계산합니다. 이 절에서는 근무 조를 짜는 방법의 수와 비밀번호가 얼마나 안전한지를 경우의 수로 따져 봅니다.</p>
