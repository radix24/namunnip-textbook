<p class="lead">모은 자료는 <em>표</em>로 정리하고, 보여 주려는 내용에 맞는 <em>그래프</em>로 나타냅니다. 변화는 꺾은선, 크기 비교는 막대, 비율은 원그래프가 알맞고, 많은 수치 자료는 도수분포표와 히스토그램으로 분포를 봅니다. 이 절에서는 매출 보고서와 배달 시간 자료를 정리해 봅니다.</p>
