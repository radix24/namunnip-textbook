<p class="lead">두 양을 나눗셈으로 비교한 것이 <em>비</em>입니다. 배합 지시서의 "1 : 2 : 4", 도면의 "1 : 50"처럼 일하는 곳에서는 비로 적힌 정보가 많습니다. 이 절에서는 비례배분으로 재료의 양을 정하고, 축척 도면에서 실제 길이와 넓이를 구합니다.</p>
