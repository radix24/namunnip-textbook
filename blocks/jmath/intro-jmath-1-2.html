<p class="lead">현장에서는 정확한 값보다 빠른 <em>어림</em>이 먼저 필요할 때가 많습니다. 어림은 계산 실수를 잡아내는 데도 쓰입니다. 그런데 같은 수라도 상황에 따라 올림, 버림, 반올림 중 알맞은 방법이 다릅니다. 이 절에서는 재료 수량을 어림하고, 상황에 맞는 어림 방법을 고르는 연습을 합니다.</p>
