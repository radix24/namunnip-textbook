<p class="lead">입체를 한 방향에서 보면 그 방향의 평면에 비친 모양만 보입니다. 건축과 기계 도면은 위, 앞, 옆에서 본 세 모양으로 입체를 나타냅니다. 이 절에서는 쌓기나무로 세 방향의 모양을 확인하고, 일부 모습만으로는 개수가 하나로 정해지지 않는다는 것을 봅니다.</p>
