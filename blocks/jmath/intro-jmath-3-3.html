<p class="lead">도형을 밀거나 돌리거나 뒤집어도 모양과 크기는 그대로인데, 이런 도형을 <em>합동</em>이라 합니다. 모양은 같고 크기만 다르면 <em>닮음</em>입니다. 이 절에서는 같은 타일로 여러 바닥 무늬를 만들고, 간판을 키울 때 넓이와 재료가 몇 배가 되는지 계산합니다.</p>
<div class="prereq">
  <span class="mono">먼저 알면 좋은 것</span>
