<p class="lead">평면의 벡터는 수 두 개, 공간의 벡터는 수 세 개로 나타냈습니다. 수를 더 늘리면 그림으로는 그릴 수 없지만, 계산은 똑같이 할 수 있습니다. 음식의 영양 성분 다섯 가지, 화면 한 점의 색(빨강·초록·파랑)처럼 여러 수를 한 묶음으로 다루는 것이 <em>n차원 벡터</em>입니다. 이 절에서는 식단을 벡터의 합과 실수배로 짜 보고, 세 원색 벡터를 섞어 원하는 색을 만들어 봅니다.</p>
