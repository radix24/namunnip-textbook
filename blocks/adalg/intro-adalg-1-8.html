<p class="lead">기저 벡터들이 서로 수직이고 크기가 모두 1이면 좌표를 구하기가 아주 쉬워집니다. 연립방정식을 풀 필요 없이 내적 한 번이면 됩니다. 이런 기저를 <em>정규직교기저</em>라고 하고, 아무 기저에서나 정사영을 빼 나가며 정규직교기저를 만드는 방법이 <em>그람-슈미트 과정</em>입니다. 이 절에서는 3차원에서 이 과정을 한 단계씩 실행하고, 두 기저에서 좌표를 구하는 수고를 비교합니다.</p>
