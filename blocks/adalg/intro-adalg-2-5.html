<p class="lead">모양을 돌리고, 뒤집고, 키우는 것은 가장 기본적인 변환입니다. 이 셋을 행렬로 쓰면 회전은 \(\cos\theta\), \(\sin\theta\)로, 대칭은 대칭축 각의 두 배로, 닮음은 대각선의 같은 수로 나타납니다. 이 절에서는 세 변환으로 목표 모양을 맞히며 행렬의 모양을 익히고, 사진을 돌릴 때 구멍이 생기는 문제를 역변환으로 해결해 봅니다.</p>
