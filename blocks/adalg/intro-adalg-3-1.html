<p class="lead">행렬을 곱하면 대부분의 벡터는 방향이 바뀌지만, 어떤 방향의 벡터는 늘어나거나 줄어들 뿐입니다. 이런 벡터가 <em>고유벡터</em>, 늘어나는 배율이 <em>고윳값</em>입니다. 고윳값은 \(\det(A - \lambda I) = 0\)을 풀어 구합니다. 이 절에서는 단위원을 따라 벡터를 돌리며 고유 방향을 직접 찾아보고, 검색 엔진이 고유벡터로 페이지의 순위를 정하는 방법을 따라가 봅니다.</p>
