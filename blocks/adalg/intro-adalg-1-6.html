<p class="lead">평면과 공간에서 내적은 \(a_1b_1 + a_2b_2 + a_3b_3\)처럼 같은 자리의 성분을 곱해 더했습니다. 이 계산은 성분이 몇 개든 그대로 할 수 있고, 그 결과로 n차원 벡터 사이의 "각"도 정할 수 있습니다. 이 절에서는 영화 장르별 별점을 벡터로 보고 코사인 유사도로 취향이 비슷한 사람을 찾는 추천의 원리를 체험하고, 내적의 크기에 한계가 있다는 코시-슈바르츠 부등식을 확인합니다.</p>
