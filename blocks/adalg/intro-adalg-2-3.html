<p class="lead">\(2 \times 2\) 행렬의 \(ad - bc\)는 역행렬이 있는지 알려 주는 수였습니다. 이 수는 두 열벡터가 만드는 평행사변형의 넓이에 방향을 나타내는 부호를 붙인 것입니다. 이것을 크기가 큰 정사각행렬로 넓힌 것이 <em>행렬식</em>입니다. 이 절에서는 열벡터를 움직이며 행렬식의 성질을 그림으로 확인하고, 계산에서 자주 나오는 실수를 찾아봅니다.</p>
