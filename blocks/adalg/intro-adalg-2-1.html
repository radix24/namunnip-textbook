<p class="lead">연립방정식을 풀 때 하던 손놀림, 곧 식의 순서 바꾸기, 식에 수 곱하기, 식끼리 더하기를 계수만 모은 행렬에서 하면 <em>기본 행 연산</em>이 됩니다. 이 세 가지로 행렬을 계단 모양으로 만드는 것이 <em>가우스 소거법</em>입니다. 이 절에서는 행 연산을 하나씩 골라 해가 하나인 경우, 무수히 많은 경우, 없는 경우를 직접 확인하고, 화학 반응식의 계수를 연립방정식으로 맞춰 봅니다.</p>
