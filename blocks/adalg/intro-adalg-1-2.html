<p class="lead">화살표만 벡터인 것은 아닙니다. 더하고 실수배할 수 있고, 그 결과가 다시 같은 집합에 들어가며, 덧셈과 실수배가 익숙한 규칙을 지키면 무엇이든 벡터처럼 다룰 수 있습니다. 이런 집합을 <em>벡터공간</em>이라고 합니다. 이 절에서는 여러 집합에서 두 원소를 골라 더하고 실수배해 보며 집합 밖으로 나가는 반례를 찾고, 다항식이 벡터처럼 움직이는 것을 그래프로 확인합니다.</p>
