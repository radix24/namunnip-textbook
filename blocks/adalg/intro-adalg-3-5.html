<p class="lead">\(ax^2 + 2bxy + cy^2 = k\)는 대칭행렬 하나로 \(\vec{x}^TA\vec{x} = k\)라 쓸 수 있습니다. \(A\)를 직교대각화해 좌표축을 고유벡터 방향으로 돌리면 \(xy\)항이 사라지고 익숙한 표준형이 나타납니다. 이 절에서는 축을 천천히 돌리며 곡선이 반듯해지는 것을 보고, 고윳값의 부호만으로 타원과 쌍곡선을 가려냅니다.</p>

</div>
