<p class="lead">고유벡터로 기저를 만들 수 있으면, 그 기저에서 보는 행렬은 축마다 고윳값만큼 늘이기만 하는 대각행렬이 됩니다. 이것이 <em>대각화</em> \(A = PDP^{-1}\)입니다. 대각화하면 \(A^n = PD^nP^{-1}\)이라 거듭제곱이 쉬워집니다. 이 절에서는 고유벡터 격자에서 변환이 단순해지는 것을 보고, 피보나치 수열의 일반항에 왜 \(\sqrt5\)가 나오는지 확인합니다.</p>
