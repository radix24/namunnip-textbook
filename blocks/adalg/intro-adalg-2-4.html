<p class="lead">행렬을 벡터에 곱하는 것은 평면의 점을 다른 점으로 옮기는 함수로 볼 수 있습니다. 덧셈과 실수배를 보존하는 이런 함수가 <em>선형변환</em>이고, 평면의 선형변환은 \(\vec{e}_1\), \(\vec{e}_2\)가 가는 곳만으로 완전히 정해집니다. 이 절에서는 행렬의 성분을 바꾸며 격자가 어떻게 휘는지 보고, 변환된 집 그림만 보고 행렬을 알아내 봅니다.</p>
