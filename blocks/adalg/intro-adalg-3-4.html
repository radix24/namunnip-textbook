<p class="lead">열벡터들이 정규직교기저를 이루는 행렬을 <em>직교행렬</em>이라고 합니다. 회전과 대칭이 그 예이며, 역행렬이 전치행렬과 같습니다. 대칭행렬은 고유벡터끼리 서로 수직이라 직교행렬로 대각화할 수 있습니다. 이 절에서는 대칭행렬이 원을 타원으로 바꿀 때 타원의 축이 고유벡터 방향임을 확인하고, 고유벡터가 수직인 이유를 한 단계씩 증명합니다.</p>
