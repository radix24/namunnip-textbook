<p class="lead">평면의 모든 점은 \((1, 0)\)과 \((0, 1)\)의 일차결합으로 나타낼 수 있고, 그 계수가 우리가 쓰던 좌표입니다. 그런데 평행하지 않은 다른 두 벡터를 골라도 평면의 모든 점을 하나씩 나타낼 수 있습니다. 이렇게 공간을 빠짐없이, 겹치지 않게 나타내는 일차독립인 벡터 묶음이 <em>기저</em>입니다. 이 절에서는 기저 벡터를 끌어 기울어진 격자 위에서 같은 점의 좌표가 어떻게 바뀌는지 보고, 낯선 기저로 좌표를 찾아봅니다.</p>
