<p class="lead">좌표공간 안에서 원점을 지나는 평면은 그 안에서 더하고 실수배해도 평면을 벗어나지 않습니다. 그래서 그 자체로 작은 벡터공간, 곧 <em>부분공간</em>입니다. 원점을 지나지 않는 평면은 그렇지 않습니다. 이 절에서는 직선, 평면, 곡면 같은 여러 집합을 3차원 그림으로 판정해 보고, 두 부분공간의 교집합이 다시 부분공간이라는 사실을 한 단계씩 증명합니다.</p>
