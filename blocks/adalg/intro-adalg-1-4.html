<p class="lead">벡터 몇 개를 실수배해 더한 것을 일차결합이라고 합니다. 세 벡터의 일차결합으로 공간 전체를 채울 수 있을 때도 있지만, 한 벡터가 나머지 둘의 일차결합이면 세 벡터는 한 평면에 갇힙니다. 이때 세 벡터는 <em>일차종속</em>이고, 그렇지 않으면 <em>일차독립</em>입니다. 이 절에서는 세 번째 벡터를 움직여 공간이 평면으로 납작해지는 순간을 찾고, 여러 벡터 묶음의 독립 여부를 예측한 뒤 계산으로 확인합니다.</p>
