<p class="lead">수에서 \(2x = 6\)을 2로 나누어 풀듯이, \(A\vec{x} = \vec{b}\)에서 \(A\)를 "나누는" 행렬이 <em>역행렬</em> \(A^{-1}\)입니다. \(A\) 옆에 단위행렬을 붙여 소거하면 역행렬이 저절로 나타납니다. 이 절에서는 네 행렬의 역행렬이 있을지 먼저 예측한 뒤 소거 과정을 따라가고, 행렬로 글자를 잠그고 역행렬로 푸는 힐 암호를 만들어 봅니다.</p>
