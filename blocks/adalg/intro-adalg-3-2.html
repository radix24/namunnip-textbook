<p class="lead">모든 정사각행렬은 자기의 특성방정식을 만족합니다. \(2 \times 2\)이면 \(A^2 - (\mathrm{tr}\,A)A + (\det A)I = O\)입니다. 이것이 <em>케일리-해밀턴 정리</em>입니다. 이 식 덕분에 \(A^2\)을 \(A\)와 \(I\)로 바꿔 쓸 수 있어, 높은 거듭제곱도 짧게 계산할 수 있습니다. 이 절에서는 계수를 바꿔 가며 정리를 스스로 찾아내고, \(A^{30}\)까지 수 두 개만으로 계산해 봅니다.</p>
