<p class="lead">공간의 곡선도 하나의 매개변수로 나타낼 수 있습니다. 세 좌표를 \(t\)의 함수로 쓴 \(\vec{r}(t) = (x(t), y(t), z(t))\)가 <em>공간곡선</em>의 매개변수 방정식입니다. 이 절에서는 용수철 모양의 나선을 위와 옆에서 보고, 여러 식이 어떤 모양의 곡선을 그리는지 짝지어 봅니다.</p>
