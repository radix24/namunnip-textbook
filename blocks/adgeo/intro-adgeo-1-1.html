<p class="lead">길이를 잴 수 없는 자와 원을 그리는 컴퍼스만으로 도형을 그리는 것을 <em>작도</em>라 합니다. 그리스 수학자들은 도구를 이렇게 제한해, 그림이 "잘 그린 것"이 아니라 "증명된 절차"가 되도록 했습니다. 이 절에서는 기본 작도를 따라가며 왜 맞는지 확인하고, 원과 직선을 직접 그어 목표 도형을 적은 수로 작도해 봅니다.</p>
