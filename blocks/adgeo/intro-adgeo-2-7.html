<p class="lead">정칙곡선은 호의 길이 함수 \(s(t)\)가 증가함수이므로 역함수를 이용해 언제나 <em>단위속력곡선으로 재매개화</em>할 수 있습니다. 곡선의 모양은 그대로이고 "시간표"만 바뀝니다. 이 절에서는 나선의 매개변수를 조절해 속력이 1이 되게 만들고, 재매개화 풀이에서 흔한 실수를 찾아봅니다.</p>
