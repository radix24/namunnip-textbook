<p class="lead">곡선이 얼마나 휘었는지를 나타내는 수가 <em>곡률</em>입니다. 단위접선벡터가 길이 1을 가는 동안 얼마나 돌아가는지로 정하고, 그 역수인 <em>곡률반경</em>은 그 점에서 곡선에 가장 잘 맞는 원의 반지름입니다. 이 절에서는 여러 곡선의 접촉원을 그려 보고, 고속도로가 직선과 원 사이에 완화곡선을 넣는 까닭을 곡률로 설명합니다.</p>
