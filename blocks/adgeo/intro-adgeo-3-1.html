<p class="lead">높이가 \(z = f(x, y)\)로 주어진 곡면을 평면 \(z = k\)로 자르면 높이가 같은 점들이 곡선을 이룹니다. 이것이 <em>등위곡선</em>이고, 지도의 등고선이 그 예입니다. 이 절에서는 곡면과 등위곡선을 함께 보고, 등위곡선의 간격과 모양만으로 곡면의 모양을 추측해 봅니다.</p>
