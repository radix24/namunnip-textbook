<p class="lead">삼각형에는 무게중심, 외심, 내심, 수심처럼 세 선이 한 점에서 만나는 경우가 많습니다. 이것을 하나의 조건으로 설명하는 것이 <em>체바의 정리</em>이고, 서로 다른 중심들 사이에 숨은 관계가 <em>오일러 직선</em>입니다. 이 절에서는 점을 움직이며 이 정리들이 언제나 성립하는지 확인합니다.</p>
