<p class="lead">기본 작도를 조합하면 더 많은 도형을 그릴 수 있습니다. 세 점에서 같은 거리에 있는 점, 세 변에서 같은 거리에 있는 점은 "같은 거리" 조건 두 개를 겹쳐 찾고, 원 위에 똑같은 간격의 꼭짓점은 중심각을 나누어 찾습니다. 이 절에서는 외접원과 내접원을 작도하고, 원 안에 여러 정다각형을 직접 작도해 봅니다.</p>
