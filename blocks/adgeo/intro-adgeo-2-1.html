<p class="lead">\(y = f(x)\)로 쓰기 어려운 곡선도 점의 위치를 하나의 변수 \(t\)의 함수 \((x(t), y(t))\)로 나타내면 쉽게 다룰 수 있습니다. 이것이 <em>매개변수 방정식</em>입니다. 이 절에서는 굴러가는 바퀴 위의 점이 그리는 사이클로이드와, 가로와 세로의 두 진동이 만드는 리사주 무늬를 매개변수로 그려 봅니다.</p>
