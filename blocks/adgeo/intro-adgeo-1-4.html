<p class="lead"><em>증명</em>은 이미 받아들인 사실에서 출발해 한 걸음씩 결론에 이르는 논증입니다. 보조선을 그어 합동인 삼각형을 만드는 것이 평면기하 증명의 기본 도구이지만, 결론을 미리 쓰거나 그림의 위치 관계를 근거 없이 믿으면 틀린 결론에 이를 수 있습니다. 이 절에서는 이등변삼각형의 성질을 증명하고, 그럴듯한 거짓 증명의 함정을 찾아봅니다.</p>
