<p class="lead">\(x, y, z\)의 이차식으로 나타나는 곡면을 <em>이차곡면</em>이라 합니다. 이차곡면을 좌표평면에 평행한 평면으로 자르면 단면은 이차곡선(타원, 쌍곡선, 포물선)이나 두 직선이 됩니다. 이 절에서는 대표적인 이차곡면을 잘라 보며 단면으로 곡면의 모양을 이해합니다.</p>
