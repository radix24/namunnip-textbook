<p class="lead">매끄러운 식으로 나타낸 곡선에도 뾰족한 점이 생길 수 있습니다. 점이 그곳에서 멈추기 때문입니다. 속도가 0이 되지 않는 곡선을 <em>정칙곡선</em>이라 하며, 정칙곡선의 길이는 속력을 적분해 구합니다. 이 절에서는 첨점이 생기는 까닭을 보고, 꺾은선의 길이가 곡선의 길이로 다가가는 모습을 확인합니다.</p>
