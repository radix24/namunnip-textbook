<p class="lead">작도로 얻는 점은 직선과 원의 교점, 곧 많아야 이차방정식의 근입니다. 그래서 작도할 수 있는 길이는 1에서 사칙연산과 제곱근만으로 얻는 수뿐입니다. 이 단순한 관찰로 2000년 넘게 풀리지 않던 작도 문제들이 "불가능"으로 판정되었습니다. 이 절에서는 길이를 직접 만들어 보며 작도 가능한 수를 익히고, 어떤 정다각형이 작도 가능한지 예측해 봅니다.</p>
