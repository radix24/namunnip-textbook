<p class="lead">구면 위에서 가장 짧은 길은 구의 중심을 지나는 평면으로 자른 <em>대원</em>의 호입니다. 세 대원호로 둘러싸인 <em>구면삼각형</em>은 평면삼각형과 성질이 달라서 세 각의 합이 늘 180°보다 큽니다. 이 절에서는 구면삼각형을 직접 움직여 보고, 비행기가 지도에서 휘어 보이는 길로 가는 이유를 확인합니다.</p>
