<p class="lead">원과 직선, 원과 사각형 사이에는 길이의 곱에 관한 아름다운 관계가 있습니다. 한 점을 지나는 직선이 원과 만나는 두 점까지 거리의 곱은 직선을 어떻게 그어도 같고(<em>방멱의 정리</em>), 원에 내접하는 사각형의 대각선의 곱은 마주 보는 변의 곱의 합과 같습니다(<em>톨레미의 정리</em>). 이 절에서는 점을 움직이며 두 정리를 확인합니다.</p>
