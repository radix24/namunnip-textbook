<p class="lead">인공지능의 예측은 대부분 확률로 나옵니다. 지난 자료에서 조건에 맞는 경우만 모아 비율을 구하면 다음에 일어날 일을 확률로 예측할 수 있습니다. 그러나 확률을 잘못 해석하면 "정확도 99%"라는 말에 크게 속을 수 있습니다. 이 절에서는 기록의 비율로 예측하고, 무엇을 전체로 삼는지 따져 예측 결과를 바르게 해석합니다.</p>
