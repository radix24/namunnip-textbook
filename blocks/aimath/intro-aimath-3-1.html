<p class="lead">디지털 이미지는 작은 네모 점(<em>픽셀</em>)이 바둑판처럼 늘어선 것입니다. 픽셀마다 밝기를 수로 적으면 이미지는 <em>행렬</em>이 되고, 색 이미지는 빨강·초록·파랑의 세 행렬이 됩니다. 이 절에서는 이미지를 행렬로 직접 만들어 보고, 인공지능이 사진을 어떤 수로 받는지 확인합니다.</p>
