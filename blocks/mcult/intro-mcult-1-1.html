<p class="lead">어울리는 두 음은 진동수의 비가 간단한 정수비입니다. 피타고라스는 현의 길이를 2 : 1, 3 : 2로 나누어 음계를 만들었습니다. 이 절에서는 현의 길이 비로 음정을 들어 보고, 오늘날 피아노가 쓰는 <em>12평균율</em>이 왜 거듭제곱근으로 만들어졌는지 따져 봅니다.</p>
