<p class="lead">영화와 애니메이션은 수학으로 만들어집니다. 영화는 1초에 24장의 사진을 이어 붙인 것이고, 컴퓨터 그래픽의 매끄러운 곡선은 몇 개의 점과 식으로 저장됩니다. 이 절에서는 영화 속 바퀴가 거꾸로 도는 착시를 <em>나머지</em>로 설명하고, <em>베지에 곡선</em>으로 경로를 직접 만들어 봅니다.</p>
