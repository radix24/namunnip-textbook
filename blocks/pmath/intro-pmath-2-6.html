<p class="lead">크기와 방향을 함께 가진 양이 벡터입니다. 강을 건너는 배의 실제 움직임은 배가 스스로 내는 속도와 물살의 속도를 더한 것이고, 이 "더하기"는 화살표를 이어 붙이는 것입니다. 이 절에서는 물살 속에서 맞은편 선착장에 정확히 닿으려면 뱃머리를 어디로 돌려야 하는지 찾고, 정해진 벡터 몇 개를 몇 번씩 써서 목표점에 도달하는 퍼즐로 덧셈과 실수배를 몸에 익힙니다.</p>
