<p class="lead">복권 한 장의 값어치는 당첨금에 당첨 확률을 곱해 더한 기댓값으로 따질 수 있습니다. 이 절에서는 상금과 참가비를 조절해 기댓값이 0인 공정한 게임을 직접 설계하고, 같은 시행을 \(n\)번 되풀이할 때 성공 횟수가 따르는 이항분포 \(\mathrm{B}(n, p)\)의 평균 \(np\)와 표준편차 \(\sqrt{np(1 - p)}\)를 시뮬레이션으로 확인합니다.</p>
