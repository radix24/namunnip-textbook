<p class="lead">\((a + b)^n\)을 전개하면 각 항의 계수는 "\(n\)개의 괄호에서 \(b\)를 몇 번 고르는가"의 수, 곧 조합의 수입니다. 이 절에서는 못이 박힌 판에 공을 떨어뜨리는 갈톤 보드로 이항계수와 파스칼의 삼각형을 직접 보고, 이항정리로 \(1.01^{10}\) 같은 거듭제곱을 계산기 없이 어림합니다.</p>
<div class="prereq">
  <span class="mono">먼저 알면 좋은 것</span>
  <span class="p">조합 nCr와 그 성질</span><span class="p">곱셈 공식 (a + b)³</span><span class="p">이항 전개와 파스칼의 삼각형</span>
</div>
