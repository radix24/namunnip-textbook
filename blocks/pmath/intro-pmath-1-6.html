<p class="lead">곡선으로 둘러싸인 넓이는 공식이 없습니다. 그래서 잘게 잘라 직사각형으로 바꾸고, 자르는 폭을 한없이 좁혀 갑니다. 이 방법이 <em>구분구적법</em>이고, 그 극한값이 <em>정적분</em>의 뜻입니다. 이 절에서는 직사각형을 늘려 가며 합이 하나의 값으로 모이는 것을 보고, 같은 생각으로 각뿔을 얇은 층으로 쌓아 부피가 왜 기둥의 \(\frac{1}{3}\)인지 확인합니다.</p>
<div class="prereq">
  <span class="mono">먼저 알면 좋은 것</span>

</div>
