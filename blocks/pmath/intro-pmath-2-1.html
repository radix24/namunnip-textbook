<p class="lead">포물선, 타원, 쌍곡선은 모두 원뿔을 평면으로 자른 단면에서 나옵니다. 그래서 세 곡선을 묶어 <em>이차곡선</em>, 또는 원뿔곡선이라고 부릅니다. 이 절에서는 3차원 원뿔을 직접 기울여 자르며 세 곡선이 어떻게 나뉘는지 보고, 초점까지의 거리와 준선까지의 거리의 비 하나(이심률)로 세 곡선이 한 가족이라는 것을 확인한 뒤 방정식으로 나타냅니다.</p>
