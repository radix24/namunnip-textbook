<p class="lead">주사위의 각 눈이 나올 확률은 \(\frac{1}{6}\)이라고 계산할 수 있지만, 압정이 바늘 끝을 위로 하고 떨어질 확률은 계산할 방법이 없습니다. 이럴 때는 많이 던져 보고 상대도수로 확률을 어림합니다. 이 절에서는 큰 수의 법칙으로 두 확률이 어떻게 이어지는지 보고, 바늘을 떨어뜨리는 실험만으로 원주율 \(\pi\)를 어림합니다.</p>
