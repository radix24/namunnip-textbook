<p class="lead">\(\frac{\sin x}{x}\)처럼 분자와 분모가 함께 0으로 가는 극한은 값을 바로 넣어서 구할 수 없습니다. 그런데 0 근처를 크게 확대하면 분자와 분모의 그래프는 모두 직선처럼 보이고, 두 직선의 기울기의 비가 극한값이 됩니다. 이것이 <em>로피탈의 정리</em>의 그림입니다. 이 절에서는 확대경으로 정리를 확인하고, 정리를 잘못 쓴 풀이에서 틀린 곳을 찾고, 다항함수와 지수함수, 로그함수 가운데 무엇이 더 빨리 커지는지 겨루어 봅니다.</p>
