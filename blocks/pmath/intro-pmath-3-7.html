<p class="lead">연속확률변수의 평균은 막대의 합 대신 넓이의 무게중심, 곧 적분 \(\int x f(x)\,dx\)로 구합니다. 미적분을 배운 뒤라야 할 수 있는 계산입니다. 이 절에서는 여러 밀도함수의 평균과 표준편차를 적분으로 구하고, 이항분포를 정규분포로 어림할 때 왜 0.5를 더하고 빼는지(연속성 보정) 확인한 뒤, 직접 모은 자료에 정규곡선을 맞춰 봅니다.</p>
