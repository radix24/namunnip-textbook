<p class="lead">적분은 미분과 달리 정해진 순서대로 계산하면 끝나는 일이 아닙니다. 식의 모양을 보고 어떤 방법을 쓸지 먼저 골라야 합니다. 이 절에서는 여러 적분을 보고 방법을 고르는 도전을 하고, \(x = \sin\theta\)로 바꾸는 삼각치환이 원의 넓이를 구하는 일과 같다는 것을 그림으로 확인하고, 분수식을 간단한 분수의 합으로 쪼개는 부분분수를 그래프로 맞춰 봅니다.</p>
