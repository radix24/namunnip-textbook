<p class="lead">두 벡터를 곱하는 방법은 두 가지입니다. <em>내적</em>은 두 벡터가 같은 쪽을 얼마나 향하는지를 수 하나로 알려 주고, <em>외적</em>은 두 벡터에 모두 수직인 새 벡터를 만들어 그 크기로 평행사변형의 넓이를 알려 줍니다. 이 절에서는 썰매를 끌 때 하는 일로 내적을, 렌치로 볼트를 돌리는 토크로 외적을 체험하고, 컴퓨터 그래픽이 외적으로 면의 방향을 구하고 내적으로 그 면의 밝기를 정하는 과정을 직접 조작해 봅니다.</p>
