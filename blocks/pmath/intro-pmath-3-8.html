<p class="lead">전체를 다 조사할 수 없을 때는 일부를 뽑아 전체를 추측합니다. 이때 어떻게 뽑느냐가 숫자의 크기보다 중요할 수 있습니다. 이 절에서는 가상의 학교에서 여러 방법으로 표본을 뽑아 평균을 추정하며 치우침(편향)이 어디서 생기는지 비교하고, 엄청나게 큰 표본을 쓰고도 결과를 틀린 유명한 여론조사의 사례를 살펴봅니다.</p>
