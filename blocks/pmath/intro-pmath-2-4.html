<p class="lead">햇빛이 바로 위에서 비출 때 생기는 그림자가 정사영입니다. 평면도형을 기울이면 그림자는 한 방향으로만 줄어들기 때문에 넓이가 기울인 각의 코사인만큼 줄어듭니다. 이 절에서는 원판을 기울여 그림자가 타원이 되는 것을 보고, 같은 관계를 거꾸로 써서 태양광 패널을 어느 각도로 세워야 햇빛을 가장 많이 받는지 따져 봅니다.</p>
