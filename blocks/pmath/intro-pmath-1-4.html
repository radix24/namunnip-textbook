<p class="lead">몫의 미분법과 역함수의 미분법만 있으면 새 함수 다섯 개의 도함수를 모두 구할 수 있습니다. 이 절에서는 곡선 위의 점을 움직이며 접선 기울기가 그리는 그래프를 직접 그려 공식과 비교합니다. 이어서 미분을 두 번, 세 번 거듭한 고계도함수가 무엇을 뜻하는지 엘리베이터의 움직임으로 확인하고, 미술관에서 그림이 가장 크게 보이는 거리를 역탄젠트의 미분으로 구합니다.</p>
