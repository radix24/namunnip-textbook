<p class="lead">줄을 세우는 방법의 수는 \(n!\)이지만, 둥근 탁자에 앉히면 돌려서 같은 배열이 생겨 수가 줄어듭니다. 목걸이처럼 뒤집을 수도 있으면 더 줄어듭니다. 이 절에서는 "같은 것으로 보는 배열"을 묶어 세는 방법을 원탁, 목걸이로 직접 확인하고, 같은 것을 여러 번 고를 수 있는 중복조합을 사탕 나누기로 셉니다.</p>
