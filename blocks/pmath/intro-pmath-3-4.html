<p class="lead">확률의 여러 정리는 직관과 어긋나는 결과를 자주 냅니다. 세 문 가운데 하나를 고른 뒤 사회자가 빈 문 하나를 열어 주면, 고른 문을 바꾸는 편이 두 배 유리합니다. 이 절에서는 몬티 홀 게임을 직접 해 보고, 검사에서 양성이 나왔을 때 정말 병에 걸렸을 확률을 넓이로 계산하고, 동전이 연속으로 앞면이 나온 뒤 뒷면이 나올 확률에 대한 흔한 착각을 살펴봅니다.</p>
