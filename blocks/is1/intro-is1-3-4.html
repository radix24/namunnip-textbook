<p class="lead">힘을 받지 않는 물체는 운동 상태를 바꾸지 않습니다(관성). 그래서 달리던 물체를 멈추려면 반드시 힘이 필요하고, 멈추게 하는 일 자체는 피할 수 없습니다. 바꿀 수 있는 것은 어떻게 멈추느냐입니다. 이 절에서는 관성 법칙을 확인한 뒤, 안전장치가 무엇을 줄이고 무엇은 그대로 두는지 힘–시간 그래프의 넓이로 따져 봅니다.</p>
<div class="prereq">
