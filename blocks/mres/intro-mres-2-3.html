<p class="lead"><em>수학 실험</em>은 직접 해 보거나 컴퓨터로 시뮬레이션해 수학적 사실을 확인하거나 값을 어림하는 탐구입니다. 실험 결과는 우연에 따라 흔들리므로, 몇 번 실험할지 정하고 결과가 얼마나 흔들리는지 함께 보고해야 합니다. 이 절에서는 확률 실험으로 π를 어림하고 실험 횟수의 의미를 따져 봅니다.</p>
